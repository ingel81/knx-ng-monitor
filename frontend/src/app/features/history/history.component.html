<div class="history-container">
  <div class="toolbar">
    <div class="tb-left">
      <h2 class="page-title">History</h2>
      @if (totalCount !== null) {
        <span class="knx-badge knx-badge--count" matTooltip="Telegramme (aktueller Filter)">{{ totalCount | number }}</span>
      }
    </div>
    <div class="tb-right">
      <app-column-manager [columns]="columnOptions" storageKey="knx.cols.history" [locked]="lockedCols"
                          [defaultHidden]="defaultHiddenCols" (hiddenChange)="onHiddenChange($event)"></app-column-manager>
      <button class="knx-btn knx-btn--outline" (click)="exportCsv()" [disabled]="isExporting"
              matTooltip="Gefilterten Bereich als CSV exportieren">
        <mat-icon svgIcon="knx:download"></mat-icon>
        {{ isExporting ? 'Exportiere…' : 'Export CSV' }}
      </button>
    </div>
  </div>

  <div class="filterbar">
    <div class="filterbar-main">
      <div class="knx-field" style="width: 300px;">
        <mat-icon class="field-icon" svgIcon="knx:search"></mat-icon>
        <input class="knx-input knx-input--search" type="text" [(ngModel)]="search"
               (ngModelChange)="onSearchChanged()" placeholder="Suchen… (Quelle, Ziel, Name, DPT, Wert)"
               aria-label="History durchsuchen">
        @if (search) {
          <button class="field-clear" (click)="search=''; applyFilters()" aria-label="Suche leeren">
            <mat-icon svgIcon="knx:close"></mat-icon>
          </button>
        }
      </div>

      <span class="fb-sep"></span>

      <div class="fb-quick" role="group" aria-label="Zeitbereich">
        <span class="fb-label">Zeit</span>
        <button class="knx-chip" [class.is-active]="timeRange === 'all'" (click)="setTimeRange('all')">Alle</button>
        <button class="knx-chip" [class.is-active]="timeRange === 'hour'" (click)="setTimeRange('hour')">Letzte Stunde</button>
        <button class="knx-chip" [class.is-active]="timeRange === 'today'" (click)="setTimeRange('today')">Heute</button>
        <button class="knx-chip" [class.is-active]="timeRange === '7d'" (click)="setTimeRange('7d')">7 Tage</button>
      </div>

      <span class="fb-sep"></span>

      <div class="fb-quick" role="group" aria-label="Nachrichtentyp">
        <span class="fb-label">Typ</span>
        <button class="knx-chip" [class.is-active]="types.has('Write')" (click)="setType('Write')">
          <span class="chip-dot" style="background: var(--write);"></span>Write
        </button>
        <button class="knx-chip" [class.is-active]="types.has('Read')" (click)="setType('Read')">
          <span class="chip-dot" style="background: var(--read);"></span>Read
        </button>
        <button class="knx-chip" [class.is-active]="types.has('Response')" (click)="setType('Response')">
          <span class="chip-dot" style="background: var(--response);"></span>Response
        </button>
      </div>

      <span class="fb-sep"></span>

      <div class="fb-quick" role="group" aria-label="Themen">
        <span class="fb-label">Thema</span>
        @for (t of topics; track t.term) {
          <button class="knx-chip" [class.is-active]="search === t.term" (click)="setTopic(t.term)">{{ t.label }}</button>
        }
      </div>
    </div>

    <div class="filterbar-main" style="margin-top: 8px;">
      <input class="knx-input" style="width: 150px;" [(ngModel)]="address" placeholder="Ziel-GA (1/2/3)" (keyup.enter)="applyFilters()">
      <input class="knx-input" style="width: 150px;" [(ngModel)]="source" placeholder="Quelle (1.1.5)" (keyup.enter)="applyFilters()">
      <input class="knx-input" style="width: 190px;" type="datetime-local" [(ngModel)]="fromValue" aria-label="Von">
      <input class="knx-input" style="width: 190px;" type="datetime-local" [(ngModel)]="toValue" aria-label="Bis">

      <span class="fb-sep"></span>

      <button class="knx-btn knx-btn--primary" (click)="applyFilters()">
        <mat-icon svgIcon="knx:search"></mat-icon>
        Anwenden
      </button>
      @if (hasActiveFilters) {
        <button class="knx-btn knx-btn--ghost" (click)="resetFilters()">
          <mat-icon svgIcon="knx:close"></mat-icon>
          Zurücksetzen
        </button>
      }
    </div>
  </div>

  <div class="grid-container">
    @if (isMobile) {
      <div class="mobile-wrap">
        <app-telegram-cards [rows]="rows" (select)="showDetail($event)"></app-telegram-cards>
        @if (hasMore) {
          <button class="knx-btn knx-btn--outline load-more" (click)="loadMore()" [disabled]="loading">
            <mat-icon svgIcon="knx:chevronDown"></mat-icon>
            {{ loading ? 'Lädt…' : 'Mehr laden' }}
          </button>
        }
      </div>
    } @else {
      <knx-table [rows]="rows" [columns]="visibleColumns" [rowHeight]="rowHeight"
                 [sortKey]="sortKey" [sortDir]="sortDir" [loading]="loading"
                 emptyText="Keine Telegramme für diese Filter."
                 (rowClick)="showDetail($event)" (sortChange)="onSort($event)" (nearEnd)="onNearEnd()"></knx-table>
    }
  </div>

  @if (archiveDays.length > 0) {
    <div class="archive-bar">
      <span class="archive-title"><mat-icon svgIcon="knx:database"></mat-icon> Archiv</span>
      @for (day of archiveDays; track day.fileName) {
        <button class="knx-chip" (click)="downloadArchiveDay(day)" matTooltip="Archiv-Tag herunterladen">
          {{ day.date }} · {{ formatBytes(day.sizeBytes) }} · {{ day.compressed ? 'gz' : 'live' }}
          <mat-icon svgIcon="knx:download"></mat-icon>
        </button>
      }
    </div>
  }
</div>
