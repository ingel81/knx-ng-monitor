<div class="app-layout">
  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <span class="brand-knx">KNX</span><span class="brand-ng">·NG</span>
        <span class="brand-sub">Monitor</span>
      </div>

      <nav class="main-nav" role="navigation" aria-label="Main navigation">
        <a routerLink="/live-view" routerLinkActive="active" class="nav-link">
          <mat-icon svgIcon="knx:live"></mat-icon>
          <span>Live View</span>
        </a>
        <a routerLink="/history" routerLinkActive="active" class="nav-link">
          <mat-icon svgIcon="knx:history"></mat-icon>
          <span>History</span>
        </a>
        <a routerLink="/projects" routerLinkActive="active" class="nav-link">
          <mat-icon svgIcon="knx:folder"></mat-icon>
          <span>Projects</span>
        </a>
        <a routerLink="/settings" routerLinkActive="active" class="nav-link">
          <mat-icon svgIcon="knx:settings"></mat-icon>
          <span>Settings</span>
        </a>
      </nav>

      <div class="user-info">
        @if (currentUser$ | async; as username) {
          <mat-icon svgIcon="knx:user"></mat-icon>
          <span class="username">{{ username }}</span>
          <button mat-icon-button (click)="logout()" matTooltip="Logout" aria-label="Logout">
            <mat-icon svgIcon="knx:logout"></mat-icon>
          </button>
        }
      </div>
    </div>
  </header>

  <main class="app-main">
    <div class="router-content">
      <router-outlet></router-outlet>
    </div>
  </main>

  <nav class="bottom-nav" role="navigation" aria-label="Main navigation (mobile)">
    <a routerLink="/live-view" routerLinkActive="active" class="bottom-link" aria-label="Live View">
      <mat-icon svgIcon="knx:live"></mat-icon>
      <span>Live</span>
    </a>
    <a routerLink="/history" routerLinkActive="active" class="bottom-link" aria-label="History">
      <mat-icon svgIcon="knx:history"></mat-icon>
      <span>History</span>
    </a>
    <a routerLink="/projects" routerLinkActive="active" class="bottom-link" aria-label="Projects">
      <mat-icon svgIcon="knx:folder"></mat-icon>
      <span>Projects</span>
    </a>
    <a routerLink="/settings" routerLinkActive="active" class="bottom-link" aria-label="Settings">
      <mat-icon svgIcon="knx:settings"></mat-icon>
      <span>Settings</span>
    </a>
  </nav>
</div>
