name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build ${{ matrix.rid }} Binary
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      # `smoke: true` marks the RIDs the runner can execute natively. The publish flags are
      # identical for every RID, so covering one per OS catches packaging defects without
      # dragging QEMU into the release path.
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: knx-ng-monitor-linux-x64.tar.gz
            archive_cmd: tar -czf
            smoke: true
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: knx-ng-monitor-linux-arm64.tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            rid: win-x64
            artifact: knx-ng-monitor-win-x64.zip
            archive_cmd: 7z a -tzip
            smoke: true
          - os: windows-latest
            rid: win-arm64
            artifact: knx-ng-monitor-win-arm64.zip
            archive_cmd: 7z a -tzip
          - os: macos-latest
            rid: osx-x64
            artifact: knx-ng-monitor-osx-x64.tar.gz
            archive_cmd: tar -czf
          - os: macos-latest
            rid: osx-arm64
            artifact: knx-ng-monitor-osx-arm64.tar.gz
            archive_cmd: tar -czf
            smoke: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build -- --configuration production
        working-directory: frontend

      - name: Copy frontend to backend wwwroot
        shell: bash
        run: |
          mkdir -p backend/KnxMonitor.Api/wwwroot
          cp -r frontend/dist/frontend/browser/* backend/KnxMonitor.Api/wwwroot/

      - name: Restore backend dependencies
        run: dotnet restore
        working-directory: backend

      - name: Publish self-contained binary
        shell: bash
        run: |
          # Derive the assembly version from the git tag: refs/tags/v0.7.0 -> 0.7.0.
          # -p:Version overrides the csproj <Version> so the published binary
          # reports the real release version instead of the default 1.0.0.0.
          VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN="${VERSION#v}"
          dotnet publish KnxMonitor.Api/KnxMonitor.Api.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=$CLEAN \
            -o ./publish/${{ matrix.rid }}
        working-directory: backend

      # Exercise the artifact that actually ships. The unit tests run against the assemblies and
      # are blind to packaging defects: 0.8.0 shipped a data-directory bug that existed only in
      # the single-file bundle and silently discarded user data across three releases.
      - name: Smoke-test published binary
        if: matrix.smoke
        shell: bash
        run: |
          set -euo pipefail
          CLEAN="${GITHUB_REF#refs/tags/v}"
          # On the Windows runner RUNNER_TEMP is a backslash path that MSYS tools mishandle;
          # cd + pwd normalises it to a POSIX path on every runner.
          WORK=$(cd "$RUNNER_TEMP" && pwd)
          SMOKE="$WORK/smoke"
          EXTRACT="$WORK/bundle-extract"
          rm -rf "$SMOKE" "$EXTRACT"
          mkdir -p "$SMOKE" "$EXTRACT"
          # Run against a copy: the app creates data/ on startup and that must never end up
          # inside the release archive.
          cp -r "backend/publish/${{ matrix.rid }}/." "$SMOKE/"

          EXE="$SMOKE/KnxMonitor.Api"
          if [ -f "$EXE.exe" ]; then EXE="$EXE.exe"; else chmod +x "$EXE"; fi

          export ASPNETCORE_ENVIRONMENT=Production
          # appsettings.json pins an explicit Kestrel endpoint, which outranks ASPNETCORE_URLS.
          # Environment variables do outrank appsettings, so bind the probe port this way and
          # stay off 8080 in case something else on the runner holds it.
          export Kestrel__Endpoints__Http__Url=http://127.0.0.1:8099
          # Mirror the container: a separate bundle extraction directory, so a data directory
          # resolved from AppContext.BaseDirectory would land there and be caught below.
          export DOTNET_BUNDLE_EXTRACT_BASE_DIR="$EXTRACT"
          if command -v cygpath >/dev/null 2>&1; then
            # The .NET single-file host needs a native Windows path here — handed a POSIX one it
            # fails to extract the bundle and dies with "Failed to create CoreCLR".
            export DOTNET_BUNDLE_EXTRACT_BASE_DIR="$(cygpath -w "$EXTRACT")"
          fi

          APP_PID=""
          start() {
            # Deliberately launched from a different working directory — the data directory has
            # to be anchored to the executable, never to the cwd.
            ( cd "$WORK" && exec "$EXE" ) > "$WORK/smoke-$1.log" 2>&1 &
            APP_PID=$!
            for _ in $(seq 60); do
              if curl -fsS -m 2 http://127.0.0.1:8099/healthz >/dev/null 2>&1; then return 0; fi
              sleep 1
            done
            echo "::error::app did not answer /healthz within 60s ($1 start)"
            cat "$WORK/smoke-$1.log" || true
            return 1
          }
          stop() {
            [ -n "$APP_PID" ] && kill "$APP_PID" 2>/dev/null || true
            sleep 3
            # Git Bash cannot reliably signal a native Windows process by its MSYS pid; only
            # force-kill leftovers after the graceful attempt above had its chance.
            command -v taskkill >/dev/null 2>&1 && taskkill //F //IM KnxMonitor.Api.exe >/dev/null 2>&1 || true
            sleep 1
          }
          # Never leave the app running when an assertion aborts the step.
          trap stop EXIT

          # 1) starts at all, and /healthz proves EF + the native SQLite provider work
          start first

          # 2) data next to the executable, nothing in the bundle extraction directory
          if [ ! -f "$SMOKE/data/knxmonitor.db" ]; then
            echo "::error::database is not next to the executable"
            find "$SMOKE" "$EXTRACT" -name knxmonitor.db || true
            exit 1
          fi
          STRAY_DB=$(find "$EXTRACT" -name knxmonitor.db)
          if [ -n "$STRAY_DB" ]; then
            echo "::error::database was written into the bundle extraction directory: $STRAY_DB"
            exit 1
          fi

          # 3) the Angular frontend is bundled and served
          # Matched without a pipe on purpose: `curl | grep -q` makes grep exit on the first hit,
          # curl dies of SIGPIPE and `set -o pipefail` would turn a passing check into a failure.
          INDEX_HTML=$(curl -fsS -m 10 http://127.0.0.1:8099/)
          case "$INDEX_HTML" in
            *"<app-root"*) ;;
            *) echo "::error::frontend missing from the published output"; exit 1 ;;
          esac

          # 4) -p:Version actually reached the assembly
          VERSION_JSON=$(curl -fsS -m 10 http://127.0.0.1:8099/api/version)
          case "$VERSION_JSON" in
            *"\"version\":\"$CLEAN"*) ;;
            *) echo "::error::expected version $CLEAN, got $VERSION_JSON"; exit 1 ;;
          esac

          # 6) the rolling file log is actually written
          ls "$SMOKE/data/logs/"*.log >/dev/null 2>&1 \
            || { echo "::error::no log file in data/logs"; exit 1; }

          SIZE_BEFORE=$(wc -c < "$SMOKE/data/knxmonitor.db")
          stop

          # 5) second start on the same data directory: migrations must be idempotent and the
          #    existing database must be reused, not replaced
          start second
          [ -f "$SMOKE/data/knxmonitor.db" ] || { echo "::error::database gone after restart"; exit 1; }
          SIZE_AFTER=$(wc -c < "$SMOKE/data/knxmonitor.db")
          [ "$SIZE_AFTER" -ge "$SIZE_BEFORE" ] \
            || { echo "::error::database shrank across restart ($SIZE_BEFORE -> $SIZE_AFTER bytes)"; exit 1; }
          stop

          echo "smoke test OK — version $CLEAN, data dir anchored to the executable"

      - name: Create archive (tar.gz)
        if: contains(matrix.artifact, '.tar.gz')
        run: tar -czf ${{ matrix.artifact }} -C backend/publish/${{ matrix.rid }} .

      - name: Create archive (zip)
        if: contains(matrix.artifact, '.zip')
        run: 7z a -tzip ${{ matrix.artifact }} ./backend/publish/${{ matrix.rid }}/*

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  # Build each arch on its OWN native runner (no QEMU). Emulated arm64
  # `dotnet publish --self-contained` inside the Dockerfile hangs for hours, so
  # amd64 builds on ubuntu-latest and arm64 on the native ubuntu-24.04-arm
  # runner. Each pushes an image by digest; merge-docker stitches them into one
  # multi-arch manifest under the shared tags.
  build-docker:
    name: Build Docker (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CLEAN strips the leading "v" so the in-image dotnet publish embeds a
      # plain SemVer (0.8.0) rather than "v0.8.0".
      - name: Derive clean version
        id: clean_version
        run: echo "CLEAN=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Forward the version into the Dockerfile ARG VERSION -> dotnet publish.
          build-args: |
            VERSION=${{ steps.clean_version.outputs.CLEAN }}
          outputs: type=image,name=ingel81/knx-ng-monitor,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # Pull the image that was just pushed and exercise it before it becomes part of a
      # manifest. Covers what the binary smoke test cannot see: the bind mount, the non-root
      # user and the built-in HEALTHCHECK.
      - name: Smoke-test image
        run: |
          set -euo pipefail
          IMAGE="ingel81/knx-ng-monitor@${{ steps.build.outputs.digest }}"
          docker pull -q "$IMAGE"

          # 8) must not run as root
          UID_IN_IMAGE=$(docker run --rm --entrypoint sh "$IMAGE" -c 'id -u')
          [ "$UID_IN_IMAGE" = "1000" ] \
            || { echo "::error::image runs as uid $UID_IN_IMAGE, expected 1000"; exit 1; }

          # 7) a bind-mounted data directory has to actually receive the database
          DATA="$RUNNER_TEMP/dockerdata"
          rm -rf "$DATA"
          mkdir -p "$DATA"
          chmod 777 "$DATA"   # the container writes as uid 1000, the runner user is not
          CID=$(docker run -d -p 8099:8080 -v "$DATA:/app/data" "$IMAGE")
          trap 'docker rm -f "$CID" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 60); do
            curl -fsS -m 2 http://127.0.0.1:8099/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -m 5 http://127.0.0.1:8099/healthz >/dev/null \
            || { echo "::error::container never answered /healthz"; docker logs "$CID"; exit 1; }

          if [ ! -f "$DATA/knxmonitor.db" ]; then
            echo "::error::database did not appear in the mounted volume"
            ls -la "$DATA" || true
            docker logs "$CID"
            exit 1
          fi

          # 9) the built-in HEALTHCHECK has to reach "healthy" (15s start period)
          for _ in $(seq 90); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$CID")" = "healthy" ] && break
            sleep 1
          done
          STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$CID")
          [ "$STATUS" = "healthy" ] \
            || { echo "::error::HEALTHCHECK reports '$STATUS'"; docker logs "$CID"; exit 1; }

          echo "image smoke test OK — uid 1000, volume written, healthcheck healthy"

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v5
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    name: Merge Docker manifest
    needs: build-docker
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ingel81/knx-ng-monitor:latest \
            -t ingel81/knx-ng-monitor:${{ steps.version.outputs.VERSION }} \
            $(printf 'ingel81/knx-ng-monitor@sha256:%s ' *)

      - name: Inspect manifest
        run: docker buildx imagetools inspect ingel81/knx-ng-monitor:${{ steps.version.outputs.VERSION }}

      - name: Logout from DockerHub
        if: always()
        run: docker logout

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, merge-docker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          # docker/build-push-action@v6+ uploads a .dockerbuild provenance artifact
          # that download-artifact@v5 chokes on. We only want the release archives.
          pattern: knx-ng-monitor-*

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Each artifact downloads into its own subdir (artifacts/<name>/<name>),
      # so flatten the archives and write one SHA256SUMS with bare filenames
      # (sha256sum -c friendly) covering every release archive.
      - name: Generate SHA256SUMS
        run: |
          mkdir -p staging
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -f {} staging/ \;
          cd staging
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create release notes
          cat > release_notes.md <<EOF
          ## Changes

          $CHANGELOG

          ## Docker Image

          Pull the Docker image:
          \`\`\`bash
          docker pull ingel81/knx-ng-monitor:$VERSION
          \`\`\`

          Or use the latest tag:
          \`\`\`bash
          docker pull ingel81/knx-ng-monitor:latest
          \`\`\`

          ## Downloads

          Self-contained binaries are available below for all supported platforms. No .NET installation required.

          ### Linux
          - **x64**: Download \`knx-ng-monitor-linux-x64.tar.gz\`
          - **ARM64**: Download \`knx-ng-monitor-linux-arm64.tar.gz\`

          ### Windows
          - **x64**: Download \`knx-ng-monitor-win-x64.zip\`
          - **ARM64**: Download \`knx-ng-monitor-win-arm64.zip\`

          ### macOS
          - **x64 (Intel)**: Download \`knx-ng-monitor-osx-x64.tar.gz\`
          - **ARM64 (Apple Silicon)**: Download \`knx-ng-monitor-osx-arm64.tar.gz\`

          ## Running the Binary

          ### Linux/macOS
          \`\`\`bash
          tar -xzf knx-ng-monitor-*.tar.gz
          ./KnxMonitor.Api
          \`\`\`

          ### Windows
          Extract the .zip file and run \`KnxMonitor.Api.exe\`

          The application will be available at \`http://localhost:8080\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/knx-ng-monitor-linux-x64.tar.gz/*
            artifacts/knx-ng-monitor-linux-arm64.tar.gz/*
            artifacts/knx-ng-monitor-win-x64.zip/*
            artifacts/knx-ng-monitor-win-arm64.zip/*
            artifacts/knx-ng-monitor-osx-x64.tar.gz/*
            artifacts/knx-ng-monitor-osx-arm64.tar.gz/*
            staging/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
