name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-binaries:
    name: Build ${{ matrix.rid }} Binary
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            artifact: knx-ng-monitor-linux-x64.tar.gz
            archive_cmd: tar -czf
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: knx-ng-monitor-linux-arm64.tar.gz
            archive_cmd: tar -czf
          - os: windows-latest
            rid: win-x64
            artifact: knx-ng-monitor-win-x64.zip
            archive_cmd: 7z a -tzip
          - os: windows-latest
            rid: win-arm64
            artifact: knx-ng-monitor-win-arm64.zip
            archive_cmd: 7z a -tzip
          - os: macos-latest
            rid: osx-x64
            artifact: knx-ng-monitor-osx-x64.tar.gz
            archive_cmd: tar -czf
          - os: macos-latest
            rid: osx-arm64
            artifact: knx-ng-monitor-osx-arm64.tar.gz
            archive_cmd: tar -czf

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build -- --configuration production
        working-directory: frontend

      - name: Copy frontend to backend wwwroot
        shell: bash
        run: |
          mkdir -p backend/KnxMonitor.Api/wwwroot
          cp -r frontend/dist/frontend/browser/* backend/KnxMonitor.Api/wwwroot/

      - name: Restore backend dependencies
        run: dotnet restore
        working-directory: backend

      - name: Publish self-contained binary
        shell: bash
        run: |
          # Derive the assembly version from the git tag: refs/tags/v0.7.0 -> 0.7.0.
          # -p:Version overrides the csproj <Version> so the published binary
          # reports the real release version instead of the default 1.0.0.0.
          VERSION="${GITHUB_REF#refs/tags/}"
          CLEAN="${VERSION#v}"
          dotnet publish KnxMonitor.Api/KnxMonitor.Api.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version=$CLEAN \
            -o ./publish/${{ matrix.rid }}
        working-directory: backend

      - name: Create archive (tar.gz)
        if: contains(matrix.artifact, '.tar.gz')
        run: tar -czf ${{ matrix.artifact }} -C backend/publish/${{ matrix.rid }} .

      - name: Create archive (zip)
        if: contains(matrix.artifact, '.zip')
        run: 7z a -tzip ${{ matrix.artifact }} ./backend/publish/${{ matrix.rid }}/*

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # QEMU provides the cross-arch emulation that lets the amd64 runner
      # build the linux/arm64 image layers (needed for Raspberry Pi pulls).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # CLEAN strips the leading "v" so the in-image dotnet publish embeds a
      # plain SemVer (0.7.0) rather than "v0.7.0".
      - name: Derive clean version
        id: clean_version
        run: echo "CLEAN=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          # Multi-arch manifest: buildx + QEMU produce both arch images and push
          # them under one tag so amd64 and arm64 hosts pull the right variant.
          platforms: linux/amd64,linux/arm64
          push: true
          # Forward the version into the Dockerfile ARG VERSION -> dotnet publish.
          build-args: |
            VERSION=${{ steps.clean_version.outputs.CLEAN }}
          tags: |
            ingel81/knx-ng-monitor:latest
            ingel81/knx-ng-monitor:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Logout from DockerHub
        if: always()
        run: docker logout

  create-release:
    name: Create GitHub Release
    needs: [build-binaries, build-docker]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          # docker/build-push-action@v6+ uploads a .dockerbuild provenance artifact
          # that download-artifact@v5 chokes on. We only want the release archives.
          pattern: knx-ng-monitor-*

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # Each artifact downloads into its own subdir (artifacts/<name>/<name>),
      # so flatten the archives and write one SHA256SUMS with bare filenames
      # (sha256sum -c friendly) covering every release archive.
      - name: Generate SHA256SUMS
        run: |
          mkdir -p staging
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp -f {} staging/ \;
          cd staging
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Create release notes
          cat > release_notes.md <<EOF
          ## Changes

          $CHANGELOG

          ## Docker Image

          Pull the Docker image:
          \`\`\`bash
          docker pull ingel81/knx-ng-monitor:$VERSION
          \`\`\`

          Or use the latest tag:
          \`\`\`bash
          docker pull ingel81/knx-ng-monitor:latest
          \`\`\`

          ## Downloads

          Self-contained binaries are available below for all supported platforms. No .NET installation required.

          ### Linux
          - **x64**: Download \`knx-ng-monitor-linux-x64.tar.gz\`
          - **ARM64**: Download \`knx-ng-monitor-linux-arm64.tar.gz\`

          ### Windows
          - **x64**: Download \`knx-ng-monitor-win-x64.zip\`
          - **ARM64**: Download \`knx-ng-monitor-win-arm64.zip\`

          ### macOS
          - **x64 (Intel)**: Download \`knx-ng-monitor-osx-x64.tar.gz\`
          - **ARM64 (Apple Silicon)**: Download \`knx-ng-monitor-osx-arm64.tar.gz\`

          ## Running the Binary

          ### Linux/macOS
          \`\`\`bash
          tar -xzf knx-ng-monitor-*.tar.gz
          ./KnxMonitor.Api
          \`\`\`

          ### Windows
          Extract the .zip file and run \`KnxMonitor.Api.exe\`

          The application will be available at \`http://localhost:8080\`
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            artifacts/knx-ng-monitor-linux-x64.tar.gz/*
            artifacts/knx-ng-monitor-linux-arm64.tar.gz/*
            artifacts/knx-ng-monitor-win-x64.zip/*
            artifacts/knx-ng-monitor-win-arm64.zip/*
            artifacts/knx-ng-monitor-osx-x64.tar.gz/*
            artifacts/knx-ng-monitor-osx-arm64.tar.gz/*
            staging/SHA256SUMS
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
